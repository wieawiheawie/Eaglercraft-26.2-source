<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d16">
  <title>Eaglercraft — Rust client</title>
  <style>
    :root { color-scheme: dark; background: #080d16; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { display: grid; place-items: center; background: #080d16; }
    main { width: 100%; height: 100%; display: grid; place-items: center; }
    canvas { display: block; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; outline: none; }
    #error { position: fixed; inset: auto 1rem 1rem; margin: 0; white-space: pre-wrap; color: #ffb4ab; }
  </style>
</head>
<body>
  <main><canvas id="game-canvas" width="1280" height="720" aria-label="Eaglercraft Rust game canvas"></canvas></main>
  <pre id="error" role="alert"></pre>
  <script type="module">
    import init, { start } from "./pkg/eagler_client_web.js";

    try {
      await init();
      await start("game-canvas");
    } catch (error) {
      document.getElementById("error").textContent =
        "The Rust client could not start:\n" + String(error);
      console.error(error);
    }
  </script>
</body>
</html>
