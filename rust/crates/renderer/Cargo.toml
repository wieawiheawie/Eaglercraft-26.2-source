[package]
name = "eagler-renderer"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
eagler-game-core.workspace = true
eagler-world.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
