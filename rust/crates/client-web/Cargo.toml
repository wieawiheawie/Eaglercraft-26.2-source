[package]
name = "eagler-client-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eagler-game-core.workspace = true
eagler-world.workspace = true
eagler-renderer.workspace = true
eagler-mod-api.workspace = true
eagler-mod-runtime.workspace = true
eagler-network.workspace = true
eagler-assets.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlCanvasElement", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "Event", "KeyboardEvent", "MouseEvent", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "Response"] }
