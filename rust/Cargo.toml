[workspace]
resolver = "3"
members = [
    "crates/game-core",
    "crates/world",
    "crates/renderer",
    "crates/mod-api",
    "crates/mod-runtime",
    "crates/network",
    "crates/assets",
    "crates/client-web",
]

[workspace.package]
edition = "2024"
license = "All-Rights-Reserved"
rust-version = "1.87"

[workspace.dependencies]
eagler-game-core = { path = "crates/game-core" }
eagler-world = { path = "crates/world" }
eagler-renderer = { path = "crates/renderer" }
eagler-mod-api = { path = "crates/mod-api" }
eagler-mod-runtime = { path = "crates/mod-runtime" }
eagler-network = { path = "crates/network" }
eagler-assets = { path = "crates/assets" }
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "portable-dispatch", "prefer-btree-collections"] }
parking_lot = "0.12.5"

[profile.dev]
opt-level = 1
debug = 0
incremental = true
codegen-units = 16

[profile.release]
opt-level = 2
debug = 0
strip = true
lto = false
codegen-units = 16
panic = "abort"

[profile.test]
opt-level = 1
debug = 0
