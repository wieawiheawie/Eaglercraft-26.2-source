name: Rust browser client

on:
  push:
    branches:
      - rust/full-wasm-rewrite
    paths:
      - "rust/**"
      - ".github/workflows/rust-client.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-client.yml"

permissions:
  contents: write

concurrency:
  group: rust-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-wasm:
    name: Test and build Rust/Wasm client (8 GiB gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      BUILD_TIME_LIMIT_SECONDS: 1200
      BUILD_MEMORY_LIMIT_MIB: 7168
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Generate workspace lockfile
        run: cargo generate-lockfile
      - name: Format Rust sources before checks
        run: cargo fmt --all
      - name: Native tests
        run: cargo test --workspace --locked
      - name: Build browser Wasm within memory/time budget
        run: ./scripts/measure-build.sh cargo build --locked --release --target wasm32-unknown-unknown -p eagler-client-web
      - name: Commit refreshed Cargo.lock
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build: refresh Rust workspace lockfile [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Upload initial browser module
        uses: actions/upload-artifact@v4
        with:
          name: eagler-rust-client-wasm
          path: rust/target/wasm32-unknown-unknown/release/eagler_client_web.wasm
          if-no-files-found: error
